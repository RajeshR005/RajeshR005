<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 420" width="590" height="420" role="img" aria-label="Dayflow: FastAPI finance backend with transactional wallet logic, JWT and Argon2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#0F1A30"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="590" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="590" height="420" fill="url(#bgg)"/><rect width="590" height="420" fill="url(#dots)"/>
<circle cx="590" cy="0" r="140" fill="#FCA311" opacity=".12" filter="url(#blur)"/></g>
<rect x=".75" y=".75" width="588.5" height="418.5" rx="18" fill="none" stroke="#2A4270" stroke-width="1.5"/>
<text x="36" y="70" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#F1F4F9" letter-spacing="-.5">Dayflow</text>
<rect x="402" y="40" width="152" height="30" rx="15" fill="#FCA311" fill-opacity=".14" stroke="#FCA311" stroke-opacity=".6"/>
<circle cx="418" cy="55" r="4.5" fill="#FCA311"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="430" y="59.5" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#FCA311">In development</text>
<text x="36" y="104" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#11B5A4">Personal finance &amp; productivity backend</text>
<text font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8"><tspan x="36" y="140">Wallet balances stay correct through every add, edit and delete.</tspan><tspan x="36" y="163">If any step fails, the whole transaction rolls back.</tspan></text>
<rect x="24" y="192" width="542" height="150" rx="12" fill="#0B1426" stroke="#2A4270"/>
<text x="40" y="216" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9FB0C8">wallet · one db transaction per entry</text>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13.5">
<g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.05;0.070;0.97;1"/><text x="40" y="246" fill="#4ADE80">+ 50,000</text><text x="150" y="246" fill="#F1F4F9">salary</text><text x="550" y="246" text-anchor="end" fill="#9FB0C8">committed</text></g>
<g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2;0.220;0.97;1"/><text x="40" y="272" fill="#F87171">−  1,200</text><text x="150" y="272" fill="#F1F4F9">groceries + receipt</text><text x="550" y="272" text-anchor="end" fill="#9FB0C8">committed</text></g>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.400;0.68;0.700;1"/><text x="40" y="298" fill="#F87171">− 12,000</text><text x="150" y="298" fill="#F1F4F9">rent + receipt</text><text x="550" y="298" text-anchor="end" fill="#F87171">upload failed ✗</text><line x1="40" y1="293" x2="360" y2="293" stroke="#F87171" stroke-width="1.5" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.540;0.68;0.700;1"/></line></g>
<g><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.720;0.97;0.990;1"/><text x="40" y="298" fill="#FCA311">↺ rolled back — file removed, balance untouched</text></g>
<line x1="40" y1="312" x2="550" y2="312" stroke="#2A4270"/>
<text x="40" y="334" fill="#9FB0C8">balance</text>
<text x="550" y="334" text-anchor="end" font-weight="700" fill="#F1F4F9" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.05;.07;.20;.22;1"/>₹50,000</text>
<text x="550" y="334" text-anchor="end" font-weight="700" fill="#4ADE80"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.20;.22;.97;1"/>₹48,800</text>
</g>
<rect x="36" y="366" width="82" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="77.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">FastAPI</text>
<rect x="126" y="366" width="135" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="193.5" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">SQLAlchemy 2.0</text>
<rect x="269" y="366" width="82" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="310.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">Alembic</text>
<rect x="359" y="366" width="52" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="385.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">JWT</text>
<rect x="419" y="366" width="75" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="456.5" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">Argon2</text>
</svg>