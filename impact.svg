<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Impact: 1.5+ years building APIs, 20+ years of USPTO patent data loaded, millions of records queried, a live agentic AI app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#0F1A30"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="1200" height="170" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="1200" height="170" fill="url(#bgg)"/><rect width="1200" height="170" fill="url(#dots)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="168.5" rx="18" fill="none" stroke="#2A4270" stroke-width="1.5"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.176;1" dur="0.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0" keyTimes="0;0.176;1" dur="0.85s" fill="freeze"/>
<text x="150.0" y="84" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#11B5A4"><tspan font-size="46">1.5+</tspan><tspan font-size="20" dx="6" fill="#F1F4F9">years</tspan></text>
<text x="150.0" y="122" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8">building scalable REST APIs</text></g>
<line x1="300.0" y1="36" x2="300.0" y2="134" stroke="#2A4270"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.320;1" dur="1.0299999999999998s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0" keyTimes="0;0.320;1" dur="1.0299999999999998s" fill="freeze"/>
<text x="450.0" y="84" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#FCA311"><tspan font-size="46">20+</tspan><tspan font-size="20" dx="6" fill="#F1F4F9">years</tspan></text>
<text x="450.0" y="122" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8">of USPTO patent data loaded</text></g>
<line x1="600.0" y1="36" x2="600.0" y2="134" stroke="#2A4270"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.421;1" dur="1.21s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0" keyTimes="0;0.421;1" dur="1.21s" fill="freeze"/>
<text x="750.0" y="84" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#11B5A4"><tspan font-size="46">Millions</tspan><tspan font-size="20" dx="6" fill="#F1F4F9"></tspan></text>
<text x="750.0" y="122" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8">of records served by optimized SQL</text></g>
<line x1="900.0" y1="36" x2="900.0" y2="134" stroke="#2A4270"/>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.496;1" dur="1.3900000000000001s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 14;0 14;0 0" keyTimes="0;0.496;1" dur="1.3900000000000001s" fill="freeze"/>
<text x="1050.0" y="84" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#FCA311"><tspan font-size="46">Live</tspan><tspan font-size="20" dx="6" fill="#F1F4F9"></tspan></text>
<text x="1050.0" y="122" text-anchor="middle" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8">agentic AI app on Render + Vercel</text></g>
</svg>