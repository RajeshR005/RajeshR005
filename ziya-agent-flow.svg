<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-label="Animated diagram of Ziya's agent pipeline">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="fwd" d="M155,120 L685,120"/>
<path id="back" d="M745,152 C 700,238 140,238 95,152"/>
</defs>
<rect width="840" height="290" rx="14" fill="#14213D"/>
<text x="32" y="40" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E5E5E5" font-weight="700">How Ziya turns a chat message into a real backend action</text>
<text x="32" y="62" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8FA3BF">the model never invents products — every answer comes from a tool call</text>
<!-- connectors -->
<g stroke="#11B5A4" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".7">
<line x1="155" y1="120" x2="195" y2="120"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="315" y1="120" x2="360" y2="120"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="480" y1="120" x2="525" y2="120"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="645" y1="120" x2="685" y2="120"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></line>
</g>
<path d="M745,152 C 700,238 140,238 95,152" stroke="#FCA311" stroke-width="2" stroke-dasharray="4 8" fill="none" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.2s" repeatCount="indefinite"/></path>
<text x="420" y="252" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#FCA311">grounded response ↩</text>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace">
<rect x="35" y="92" width="120" height="58" rx="10" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.5"/>
<text x="95" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#E5E5E5">User</text>
<text x="95" y="136" text-anchor="middle" font-size="11" fill="#8FA3BF">chat message</text></g>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace">
<rect x="195" y="92" width="120" height="58" rx="10" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.5"/>
<text x="255" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#E5E5E5">FastAPI</text>
<text x="255" y="136" text-anchor="middle" font-size="11" fill="#8FA3BF">POST /ziya/chat</text></g>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace">
<rect x="360" y="92" width="120" height="58" rx="10" fill="#1B2B4E" stroke="#FCA311" stroke-width="2"/>
<text x="420" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#E5E5E5">LangGraph</text>
<text x="420" y="136" text-anchor="middle" font-size="11" fill="#8FA3BF">agent reasons</text></g>
<g transform="translate(420 121)"><rect x="-60" y="-29" width="120" height="58" rx="10" fill="none" stroke="#FCA311" stroke-width="2">
<animate attributeName="stroke-opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum"/>
</rect></g>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace">
<rect x="525" y="92" width="120" height="58" rx="10" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.5"/>
<text x="585" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#E5E5E5">Tools</text>
<text x="585" y="136" text-anchor="middle" font-size="11" fill="#8FA3BF">LangChain</text></g>
<g font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace">
<rect x="685" y="92" width="120" height="58" rx="10" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.5"/>
<text x="745" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#E5E5E5">MySQL</text>
<text x="745" y="136" text-anchor="middle" font-size="11" fill="#8FA3BF">live data</text></g>
<text x="585" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11" fill="#11B5A4" opacity="0">filter_products_tool<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.01;0.31;0.333;1" dur="6s" repeatCount="indefinite"/></text>
<text x="585" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11" fill="#11B5A4" opacity="0">one_product_tool<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.333;0.353;0.647;0.667;1.000" dur="6s" repeatCount="indefinite"/></text>
<text x="585" y="176" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11" fill="#11B5A4" opacity="0">manage_cart  🔒<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.667;0.687;0.980;1.000;1.000" dur="6s" repeatCount="indefinite"/></text>
<circle r="6" fill="#11B5A4" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#fwd"/></animateMotion>
<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#FCA311" filter="url(#glow)" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#back"/></animateMotion>
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
</svg>