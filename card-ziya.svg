<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 420" width="590" height="420" role="img" aria-label="Ziya: live agentic AI shopping assistant built with FastAPI, LangGraph, LangChain and MySQL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#0F1A30"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="590" height="420" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="590" height="420" fill="url(#bgg)"/><rect width="590" height="420" fill="url(#dots)"/>
<circle cx="590" cy="0" r="140" fill="#4ADE80" opacity=".12" filter="url(#blur)"/></g>
<rect x=".75" y=".75" width="588.5" height="418.5" rx="18" fill="none" stroke="#2A4270" stroke-width="1.5"/>
<text x="36" y="70" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#F1F4F9" letter-spacing="-.5">Ziya</text>
<rect x="482" y="40" width="72" height="30" rx="15" fill="#4ADE80" fill-opacity=".14" stroke="#4ADE80" stroke-opacity=".6"/>
<circle cx="498" cy="55" r="4.5" fill="#4ADE80"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="510" y="59.5" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#4ADE80">Live</text>
<text x="36" y="104" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#11B5A4">Agentic AI shopping assistant</text>
<text font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#9FB0C8"><tspan x="36" y="140">An LLM agent that understands intent, picks the right tool,</tspan><tspan x="36" y="163">and calls real FastAPI endpoints to search, review and cart.</tspan></text>
<rect x="24" y="192" width="542" height="150" rx="12" fill="#0B1426" stroke="#2A4270"/>
<text x="40" y="216" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9FB0C8">agent loop</text>
<path id="zf" d="M96,262 L495,262" fill="none"/>
<path id="zb" d="M495,283 C 465,318 126,318 96,283" fill="none"/>
<line x1="96" y1="262" x2="495" y2="262" stroke="#11B5A4" stroke-width="2" stroke-dasharray="5 6" opacity=".6"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></line>
<path d="M495,283 C 465,318 126,318 96,283" stroke="#FCA311" stroke-width="1.8" stroke-dasharray="4 7" fill="none" opacity=".55"><animate attributeName="stroke-dashoffset" from="0" to="22" dur="1.2s" repeatCount="indefinite"/></path>
<rect x="44" y="244" width="104" height="38" rx="9" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.2"/><text x="96" y="268" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#F1F4F9">Chat</text>
<rect x="177" y="244" width="104" height="38" rx="9" fill="#1B2B4E" stroke="#FCA311" stroke-width="1.8"/><text x="229" y="268" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#F1F4F9">LangGraph</text>
<rect x="310" y="244" width="104" height="38" rx="9" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.2"/><text x="362" y="268" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#F1F4F9">Tools</text>
<rect x="443" y="244" width="104" height="38" rx="9" fill="#1B2B4E" stroke="#11B5A4" stroke-width="1.2"/><text x="495" y="268" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#F1F4F9">MySQL</text>
<g transform="translate(229 263)"><rect x="-52" y="-19" width="104" height="38" rx="9" fill="none" stroke="#FCA311" stroke-width="2"><animate attributeName="stroke-opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="1;1.12;1" dur="2s" repeatCount="indefinite"/></rect></g>
<text x="295" y="334" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#FCA311">grounded answer</text>
<circle r="5.5" fill="#11B5A4" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"><mpath href="#zf"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="3s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#FCA311" filter="url(#glow)" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;.5;1" calcMode="linear"><mpath href="#zb"/></animateMotion><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.5;1" dur="3s" repeatCount="indefinite"/></circle>
<rect x="36" y="366" width="82" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="77.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">FastAPI</text>
<rect x="126" y="366" width="97" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="174.5" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">LangGraph</text>
<rect x="231" y="366" width="97" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="279.5" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">LangChain</text>
<rect x="336" y="366" width="60" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="366.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">Groq</text>
<rect x="404" y="366" width="67" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="437.5" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">MySQL</text>
<rect x="479" y="366" width="52" height="28" rx="14.0" fill="none" stroke="#9FB0C8" stroke-opacity=".55"/><text x="505.0" y="384.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#9FB0C8">JWT</text>
</svg>